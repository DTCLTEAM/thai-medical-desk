  <style>
/* BD SOURCE — Event & Outdoor Branding Management System */
:root {
  --blue: #1b4ea2; --navy: #0d2f6b; --navy-2: #0a2556; --red: #e3262b; --green: #0a8a3a; --yellow: #f2d814; --sky: #1fa5de;
  --ink: #18202f; --muted: #667085; --line: #e3e7ef; --bg: #f3f5f9; --card: #fff; --hover: #f6f8fc;
  --good: #0a8a3a; --good-bg: #e7f6ed; --warn: #a15c00; --warn-bg: #fff4dc; --bad: #c4161c; --bad-bg: #fdeaea; --info-bg: #e9f1fc;
  --r: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --font: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --head: "Montserrat", "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--head); margin: 0; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); font-size: .9em; }
.sm { font-size: .85em; }
.neg { color: var(--bad); font-weight: 600; }
.warn-t { color: var(--warn); }
.err-t { color: var(--bad); font-size: .88em; }
pre.err { white-space: pre-wrap; background: var(--bad-bg); padding: 12px; border-radius: 8px; font-size: 12px; }

/* ---------- layout ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: 248px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 40; }
.brand { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
.brand::before { content: ""; position: absolute; left: 0; top: 0; height: 4px; width: 100%; background: linear-gradient(90deg, var(--red) 0 25%, var(--green) 25% 50%, var(--blue) 50% 75%, var(--yellow) 75%); }
.brand img { width: 100%; max-width: 200px; display: block; }
.nav { flex: 1; overflow-y: auto; padding: 8px 10px 16px; }
.nav-g { margin-top: 10px; }
.nav-gl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #98a2b3; padding: 6px 10px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #344054; font-weight: 600; font-size: 14.5px; }
.nav a:hover { background: var(--hover); text-decoration: none; }
.nav a.on { background: var(--blue); color: #fff; }
.nav svg { width: 18px; height: 18px; fill: currentColor; opacity: .85; flex: none; }
.side-f { font-size: 11.5px; color: var(--muted); padding: 12px 18px; border-top: 1px solid var(--line); }
.main-w { margin-left: 248px; min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top .menu, .top-logo { display: none; }
.gsearch { flex: 1; max-width: 560px; }
.gsearch input { width: 100%; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.demo-bar { background: var(--navy); color: #dbe6ff; font-size: 13px; padding: 7px 24px; }
.demo-bar a { color: #fff; text-decoration: underline; }
main { padding: 22px 24px 60px; max-width: 1360px; width: 100%; }
.scrim { display: none; }

/* ---------- page parts ---------- */
.page-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-h h1 { font-size: 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-h .sub { color: var(--muted); margin-top: 2px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 18px; min-width: 0; }
.card.hl { border-color: #f5c46b; box-shadow: 0 0 0 3px #fff4dc; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h3 { font-size: 15px; }
.card-b { padding: 14px 16px; }
.card-b > .tbl-wrap:first-child { margin: -14px -16px 0; }
.card-b > .tbl-wrap:only-child { margin: -14px -16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; align-items: start; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input[type=search], .toolbar select, .toolbar input[type=month] { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 200px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.empty.sm { padding: 10px 0; text-align: left; }
.byline { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.locked { padding: 14px; background: var(--hover); border-radius: 8px; color: var(--muted); }
.warn-box, .info-box { padding: 11px 14px; border-radius: 8px; margin-bottom: 14px; background: var(--warn-bg); border: 1px solid #f5d38b; color: #6b3d00; }
.warn-box.err { background: var(--bad-bg); border-color: #f4b3b5; color: #8b1014; }
.info-box { background: var(--info-bg); border-color: #c7dbf7; color: #173f7a; }
.pre { white-space: pre-wrap; font: 13.5px/1.5 var(--font); margin: 0; }
.pre.rel { font: 12.5px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; overflow-x: auto; white-space: pre; }

/* ---------- buttons, chips, badges ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid #cfd6e3; background: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 14px; line-height: 1.2; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--navy); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #f2c2c4; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; padding: 11px; }
.icon-btn { border: 0; background: none; padding: 6px; cursor: pointer; }
.icon-btn svg { width: 24px; height: 24px; fill: var(--ink); }
.lnk { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 2px 4px; font-size: 13.5px; }
.lnk.danger { color: var(--bad); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.green { background: var(--good-bg); color: var(--good); }
.badge.blue { background: var(--info-bg); color: var(--blue); }
.badge.amber { background: var(--warn-bg); color: var(--warn); }
.badge.red { background: var(--bad-bg); color: var(--bad); }
.badge.grey { background: #eef0f4; color: #556070; }
.badge.role { background: var(--navy); color: #fff; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: #eef0f4; color: #475467; vertical-align: middle; }
.chip.sample { background: var(--yellow); color: #3d3500; letter-spacing: .04em; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.stars { color: #f0a500; letter-spacing: 1px; }
.stars span { color: #d0d5dd; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.pill.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs a { padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--blue); border-color: var(--blue); }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.st-sel { padding: 7px 10px; border: 1px solid #cfd6e3; border-radius: 8px; background: #fff; font-weight: 600; }

/* ---------- KPIs ---------- */

/* ---------- tables ---------- */

(function () {

    if (parts.length !== 2) return null;
    let a = parts[0], b = parts[1];
    // "5'x2.5" → second number takes the first one's unit
    if (/^\d+(\.\d+)?$/.test(b) && /"$/.test(a.trim())) b += '"';
    if (/^\d+(\.\d+)?$/.test(a) && /"$/.test(b.trim())) a += '"';
    const w = BD.parseLen(a), h = BD.parseLen(b);
    return w && h ? { w, h } : null;
  };
  BD.AREA_UOM = ['SFT'];
  BD.LEN_UOM = ['RFT'];
  BD.bdLine = function (it) {
    const qty = +it.qty || 0, rate = +it.rate || 0, sz = BD.parseSize(it.size);
    const u = String(it.uom || '').toUpperCase();
    let auto = null, how = '';
    if (BD.AREA_UOM.includes(u)) { if (sz && sz.w) { auto = sz.w * sz.h * qty; how = `${BD.r2(sz.w * sz.h)} sft each × ${qty}`; } }
    else if (BD.LEN_UOM.includes(u)) { if (sz && sz.len) { auto = sz.len * qty; how = `${BD.r2(sz.len)} rft each × ${qty}`; } else if (sz && sz.w) { auto = sz.w * sz.h * qty; how = 'area'; } }
    else { auto = qty; how = ''; }
    const manual = it.total !== '' && it.total != null && !isNaN(+it.total) && +it.total > 0;
    const total = BD.r2(manual ? +it.total : auto || 0);
    let err = '';
    if (!(total > 0)) err = BD.AREA_UOM.includes(u) || BD.LEN_UOM.includes(u) ? 'Enter a size (e.g. 8\'x3\') with qty, or type the total ' + u.toLowerCase() : 'Enter a quantity';
    const amount = err ? 0 : BD.r2(total * rate);
    return { err, total, auto: auto == null ? null : BD.r2(auto), manual, how, amount, cost: BD.r2(+it.estCost || 0), area: BD.AREA_UOM.includes(u) ? total : 0 };
  };
  BD.line = function (it) {
    if (it.kind === 'bd') return BD.bdLine(it);
    if (it.kind === 'branding') {
      const u = BD.UNITS[it.mu];
      const w = +it.width, h = +it.height, p = +it.pieces;
      let err = '';
      if (!u) err = 'Select a measurement unit';
      else if (!(w > 0 && h > 0)) err = 'Width and height must be above zero';
      else if (!(p >= 1) || Math.round(p) !== p) err = 'Pieces must be a whole number, 1 or more';
      const each = err ? 0 : BD.r2(w * u.toFt * (h * u.toFt));
      const area = err ? 0 : BD.r2(w * u.toFt * (h * u.toFt) * p);
      const perSqft = (+it.matRate || 0) + (+it.printRate || 0);
      const lump = BD.LUMP.reduce((s, [k]) => s + (+it[k] || 0), 0);
      const amount = err ? 0 : BD.r2(area * perSqft + lump);
      return { err, each, area, sqm: BD.r2(area * BD.SQFT_TO_SQM), perSqft, lump, amount, cost: BD.r2(+it.estCost || 0) };
    }
    const amount = BD.r2((+it.qty || 0) * (+it.rate || 0));
    return { err: '', amount, cost: BD.r2(+it.estCost || 0) };
  };

  // taxSel = [{id,name,rate}] snapshot stored on the document
  // opts.exact = VAT to the paisa per line (as on Akij POs) instead of rounding VAT to whole Taka
  BD.totals = function (items, discType, discVal, taxSel, opts) {
    const rows = (items || []).map(BD.line);
    const sub = BD.r2(rows.reduce((s, r) => s + r.amount, 0));
    let disc = discType === 'pct' ? BD.r2((sub * (+discVal || 0)) / 100) : BD.r2(+discVal || 0);
    if (disc > sub) disc = sub;
    if (disc < 0) disc = 0;
    const taxable = BD.r2(sub - disc);
    const roundT = !(opts && opts.exact) && BD.db && BD.db.settings && BD.db.settings.roundTaka;
    const taxes = (taxSel || []).map((t) => { const a = (taxable * (+t.rate || 0)) / 100; return { id: t.id, name: t.name, rate: +t.rate, amount: roundT ? Math.round(a) : BD.r2(a) }; });
    const tax = BD.r2(taxes.reduce((s, t) => s + t.amount, 0));
    const total = BD.r2(taxable + tax);
    const cost = BD.r2(rows.reduce((s, r) => s + r.cost, 0));
    const margin = BD.r2(taxable - cost);
    return { rows, sub, disc, discPct: sub ? BD.r2((disc / sub) * 100) : 0, taxable, taxes, tax, total, cost, margin, marginPct: taxable ? BD.r2((margin / taxable) * 100) : 0, errors: rows.filter((r) => r.err).length };
  };
  // vatMode: 'add' = Excluding VAT, VAT added on top (default) · 'incl' = Including VAT & Tax · 'none' = Excluding VAT & Tax (not charged)
  BD.docTaxes = (d) => (!d.vatMode || d.vatMode === 'add' ? d.taxes : []);
  BD.VAT_MODES = [['add', 'Excluding VAT — add VAT line'], ['incl', 'Including VAT & Tax (rates already include VAT)'], ['none', 'Excluding VAT & Tax (VAT not charged)']];
  BD.vatLabel = (d) => (d.vatMode === 'incl' ? ' (Including VAT & Tax)' : d.vatMode === 'none' ? ' (Excluding VAT & Tax)' : '');
  BD.qTotals = (q) => BD.totals(q.items, q.discType, q.discVal, BD.docTaxes(q), { exact: q.vatExact });
  BD.invTotals = (inv) => BD.totals(inv.lines, 'amt', 0, BD.docTaxes(inv), { exact: inv.vatExact });
  BD.spoTotal = (s) => BD.r2((s.lines || []).reduce((a, l) => a + BD.line(l).amount, 0));
  BD.qNo = (q) => `${q.baseNo} R${q.rev}`;

  /* ---------- balances ---------- */
  const live = (x) => x.status !== 'Cancelled';
  BD.invoicePaid = (inv) => BD.r2(BD.db.receipts.filter(live).reduce((s, r) => s + (r.allocations || []).filter((a) => a.invoiceId === inv.id).reduce((t, a) => t + (+a.amount || 0), 0), 0));
  BD.invoiceBalance = (inv) => (inv.status === 'Issued' ? BD.r2(BD.invTotals(inv).total - BD.invoicePaid(inv)) : 0);
  BD.invoiceStatus = (inv) => {
    if (inv.status === 'Cancelled') return 'Cancelled';
    if (inv.status === 'Draft') return 'Draft';
    const bal = BD.invoiceBalance(inv), paid = BD.invoicePaid(inv);
    if (bal <= BD.EPS) return 'Paid';
    if (inv.due && inv.due < BD.today()) return 'Overdue';
    return paid > 0 ? 'Partially Paid' : 'Unpaid';
  };
  BD.receiptAllocated = (r) => BD.r2((r.allocations || []).reduce((s, a) => s + (+a.amount || 0), 0));
  BD.receiptUnallocated = (r) => (live(r) ? BD.r2(r.amount - BD.receiptAllocated(r)) : 0);

  BD.billPaid = (b) => BD.r2(BD.db.payments.filter(live).reduce((s, p) => s + (p.allocations || []).filter((a) => a.billId === b.id).reduce((t, a) => t + (+a.amount || 0), 0), 0));
  BD.billBalance = (b) => (live(b) ? BD.r2(b.amount - BD.billPaid(b)) : 0);
  BD.billStatus = (b) => {
    if (b.status === 'Cancelled') return 'Cancelled';

  };
  BD.paymentAllocated = (p) => BD.r2((p.allocations || []).reduce((s, a) => s + (+a.amount || 0), 0));
  BD.paymentUnallocated = (p) => (live(p) ? BD.r2(p.amount - BD.paymentAllocated(p)) : 0);

  BD.clientBalance = (cid) => {

    const invoiced = BD.r2(inv.reduce((s, i) => s + BD.invTotals(i).total, 0));

    const credit = BD.r2(BD.db.receipts.filter((r) => r.clientId === cid).reduce((s, r) => s + BD.receiptUnallocated(r), 0));

  BD.supplierBalance = (sid) => {

  BD.poVariance = (po) => {

  BD.projectFin = (p) => {
    const q = BD.get('quotations', p.quotationId);

    const qt = q ? BD.qTotals(q) : { taxable: 0, total: 0, cost: 0 };

    const invoiced = BD.r2(invs.reduce((s, i) => s + BD.invTotals(i).taxable, 0));
    const invoicedGross = BD.r2(invs.reduce((s, i) => s + BD.invTotals(i).total, 0));
    const received = BD.r2(invs.reduce((s, i) => s + BD.invoicePaid(i), 0));
    const bills = BD.db.bills.filter((b) => b.projectId === p.id && live(b));
    const billCost = BD.r2(bills.reduce((s, b) => s + (+b.amount || 0), 0));
    const billPaid = BD.r2(bills.reduce((s, b) => s + BD.billPaid(b), 0));
    const exps = BD.db.expenses.filter((e) => e.projectId === p.id && BD.expenseIsCost(e));
    const expCost = BD.r2(exps.reduce((s, e) => s + (+e.amount || 0), 0));
    const actualCost = BD.r2(billCost + expCost);
    return {
      contract, estCost, projectedProfit: BD.r2(contract - estCost), invoiced, invoicedGross, received,

  };

  // Allocation editor shared by receipts and payments
  function allocRows(kind, partyId, current, amountSel) {
    const isR = kind === 'r';
    const docs = isR ? db().invoices.filter((i) => i.clientId === partyId && i.status === 'Issued') : db().bills.filter((b) => b.supplierId === partyId && live(b));
    const cur = {}; (current || []).forEach((a) => (cur[isR ? a.invoiceId : a.billId] = a.amount));
    const open = docs.map((x) => ({ x, bal: BD.r2((isR ? BD.invoiceBalance(x) : BD.billBalance(x)) + (cur[x.id] || 0)) })).filter((o) => o.bal > BD.EPS || cur[o.x.id]);
    if (!open.length) return '<div class="empty sm">No open ' + (isR ? 'invoices' : 'bills') + ' for this ' + (isR ? 'client' : 'supplier') + '. The amount will be kept as an unallocated ' + (isR ? 'advance/credit' : 'advance/deposit') + '.</div>';
    return `<div class="alloc"><div class="alloc-h"><span>${isR ? 'Invoice' : 'Bill'}</span><span>Due</span><span>Open balance</span><span>Allocate (Tk)</span></div>${open.map((o) => `<div class="alloc-r"><span><b>${isR ? o.x.no : esc(o.x.billNo)}</b></span><span>${A.fd(o.x.due)}</span><span>${A.money(o.bal)}</span><input type="number" step="any" min="0" max="${o.bal}" data-doc="${o.x.id}" data-max="${o.bal}" value="${cur[o.x.id] || ''}" oninput="A.allocSum()"></div>`).join('')}<div class="alloc-f"><button type="button" class="btn sm" onclick="A.allocAuto('${amountSel}')">Auto-allocate (oldest first)</button><span id="alloc-sum"></span></div></div>`;
  }
  A.allocSum = () => { const s = BD.r2([...document.querySelectorAll('[data-doc]')].reduce((a, i) => a + (+i.value || 0), 0)); const amt = +(($('#f_amount') || {}).value || A._allocAmt || 0); const el = $('#alloc-sum'); if (el) el.innerHTML = `Allocated ${A.money(s)} of ${A.money(amt)} · <b>${A.money(BD.r2(amt - s))}</b> left unallocated`; };
  A.allocAuto = () => { let left = +(($('#f_amount') || {}).value || A._allocAmt || 0); document.querySelectorAll('[data-doc]').forEach((i) => { const v = Math.min(left, +i.dataset.max); i.value = v > 0 ? BD.r2(v) : ''; left = BD.r2(left - (v > 0 ? v : 0)); }); A.allocSum(); };
  function readAlloc(kind, amount) {
    const list = [...document.querySelectorAll('[data-doc]')].map((i) => ({ id: i.dataset.doc, amount: BD.r2(+i.value || 0), max: +i.dataset.max })).filter((x) => x.amount > 0);
    for (const x of list) if (x.amount > x.max + BD.EPS) { alert(`Allocation ${A.money(x.amount)} is more than the open balance ${A.money(x.max)}.`); return null; }
    const sum = BD.r2(list.reduce((s, x) => s + x.amount, 0));
    if (sum > amount + BD.EPS) { alert(`Allocated ${A.money(sum)} is more than the amount ${A.money(amount)}.`); return null; }
    return list.map((x) => (kind === 'r' ? { invoiceId: x.id, amount: x.amount } : { billId: x.id, amount: x.amount }));
  }

  A.importRecords = (j, fname) => {
    const d = db(), log = [];

      if (!c) { c = { id: BD.uid(), name: x.name, contacts: [], attachments: [] }; A.stamp(c, true); d.clients.push(c); log.push('New client: ' + x.name); } else log.push('Updated client: ' + c.name);

      (x.contacts || []).forEach((k) => { if (!c.contacts.some((y) => BD.norm(y.name) === BD.norm(k.name))) c.contacts.push(Object.assign({ id: BD.uid(), designation: '', phone: '', whatsapp: '', email: '' }, k)); });

      const tx = d.settings.taxes.find((t) => t.rate === (x.vatRate || 15) && t.active) || d.settings.taxes[0];
      const res = A.createPoDirect({ clientId: c.id, poNo: x.poNo, date: x.date, prNo: x.prNo, prDate: x.prDate, note: x.note, terms: x.terms, vatExact: x.vatExact !== false, taxes: [{ id: tx.id, name: tx.name, rate: tx.rate }], lines: x.lines.map((l) => Object.assign({ kind: 'bd', spec: '', size: '', location: '' }, l)), value: x.value, source: fname });

      if (x.createProject && res.po.status === 'Approved') { const keep = A.go; A.go = () => {}; try { A.createProject(res.po.id); } finally { A.go = keep; } }
    });

      ['Reminders', 'Shown on the dashboard when you open the app.', 'Scheduled email / WhatsApp / SMS reminders.'],
      ['Excel export', 'CSV files (open in Excel).', 'Native .xlsx with formatting if required.'],
      ['Backup', 'Manual JSON download / restore.', 'Automatic daily database backups.'],
      ['Tax', 'Configurable rates; no tax filing.', 'VAT return (Mushak) formats if needed.'],
    ]));

  /* =================== PRINTING — BD SOURCE letterhead, same layout as the Excel estimates & bills =================== */
  const co = () => db().settings.company;
  const lh = (title, inner) => {
    const c = co();
    return `<div class="doc"><div class="doc-art"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i><i class="d6"></i><i class="d7"></i><i class="d8"></i></div><img class="doc-logo" src="${BD_LOGO}" alt="BD SOURCE"><div class="doc-in"><h1 class="doc-t">${title}</h1>${inner}</div><div class="doc-foot">${esc(c.address)}<br>Mobile: ${esc(c.phone)}, E-mail: ${esc(c.email)}${c.bin ? ' · BIN: ' + esc(c.bin) : ''}</div></div>`;
  };
  // Always one page: if the content is taller than the page, shrink it to fit (A4 and A5 paper keep the same shape).
  A.fitPage = () => {
    const P = $('#print'), keep = P.getAttribute('style') || '';
    P.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;visibility:hidden';
    P.querySelectorAll('.doc').forEach((d) => {
      const inn = d.querySelector('.doc-in'); if (!inn) return;
      inn.style.transform = ''; inn.style.width = ''; inn.style.height = '';
      d.classList.remove('multi', 'compact');
      if (inn.scrollHeight > inn.clientHeight + 1) d.classList.add('compact'); // 1st: tighter spacing
      const room2 = inn.clientHeight, need2 = inn.scrollHeight;
      if (need2 > room2 + 1) {
        const k = room2 / need2; // 2nd: shrink a little; 3rd: flow onto more pages
        if (k >= 0.72) { inn.style.transform = `scale(${k})`; inn.style.width = 100 / k + '%'; inn.style.height = 100 / k + '%'; }
        else d.classList.add('multi'); // too long to shrink and stay readable → print on more pages
      }
    });
    P.setAttribute('style', keep);
  };
  A.print = (html, title) => {
    $('#print').innerHTML = html; const old = document.title; document.title = title;
    const imgs = [...$('#print').querySelectorAll('img')];
    Promise.all(imgs.map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))).then(() => {
      A.fitPage();
      document.body.classList.add('printing');
      setTimeout(() => { window.print(); setTimeout(() => { document.body.classList.remove('printing'); document.title = old; }, 300); }, 100);
    });
  };
  const clean = (n) => String(n || '').replace(/\s*\(Sample\)/g, '');
  const seq = (no) => String(no || '').split('-').pop();
  A.refEstimate = (q) => `${co().refEstimate || 'BD Source/Estimate'}/${q.date.slice(0, 4)}/E-${seq(q.baseNo)}${q.rev ? ' R' + q.rev : ''}`;
  A.refBill = (i) => `${co().refBill || 'BD Source/Bill'}/${i.date.slice(0, 4)}/${seq(i.no)}`;
  // "To" block exactly like the Excel sheets
  const toBlock = ({ client, attn, ref, date, po, subject }) => {
    const k = (client.contacts || []).find((x) => x.name === attn) || (attn ? { name: attn } : null);
    return `<table class="meta"><tr><td><b>Ref:</b> ${esc(ref)}</td><td class="r"><b>Dated:</b> ${BD.fd(date)}</td></tr></table>
      <div class="to">To<br>${esc(client.addressee || 'Managing Director')}<br><b>${esc(clean(client.name))}</b><br>${esc(client.billing || client.address || '').replace(/\n/g, '<br>')}${client.tin ? `<br>${esc(client.tin)}` : ''}</div>
      ${po ? `<div class="po">Purchase Order No - ${esc(po)}${client.supplierCode ? ` &nbsp;·&nbsp; Supplier Code - ${esc(client.supplierCode)}` : ''}</div>` : ''}
      ${k ? `<div class="attn"><b>Kind Attn.:</b> ${esc(k.name)}${k.designation ? `<br><span>${esc(k.designation)}</span>` : ''}${k.phone ? `<br><span>Mobile: ${esc(k.phone)}</span>` : ''}</div>` : ''}
      <p class="sub"><b>Sub:</b> ${esc(subject)}</p>`;
  };
  // Item table: Sl No | Item Name | Description | UOM | Size | Qty | Total Sft/Pcs | Rate | Amount
  const itemTable = (lines) => `<table class="items"><thead><tr><th>Sl No</th><th>Item Name${lines.some((l) => l.code) ? ' / Code' : ''}</th><th>Description</th><th>UOM</th><th>Size</th><th>Qty</th><th>Total Sft/Pcs</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${lines.map((l, n) => { const v = A.lineView(l); return `<tr><td class="c">${n + 1}</td>${v.spec && v.spec.trim().toLowerCase() !== String(v.item).trim().toLowerCase() ? `<td><b>${esc(v.item)}</b>${v.code ? `<br><span class="m">${esc(v.code)}</span>` : ''}</td><td class="m">${esc(v.spec)}</td>` : `<td colspan="2"><b>${esc(v.item)}</b>${v.code ? ` <span class="m">· ${esc(v.code)}</span>` : ''}</td>`}<td>${esc(v.uom)}</td><td>${esc(v.size)}</td><td class="r">${v.qty}</td><td class="r">${v.total}</td><td class="r">${v.rate}</td><td class="r">${BD.amt(v.amount)}</td></tr>`; }).join('')}</tbody></table>`;
  const totalRows = (t, doc, extra = []) => {
    const rows = [[`Total Amount${BD.vatLabel(doc)} =`, t.sub]];
    if (t.disc) rows.push([`Less: Discount (${t.discPct}%) =`, -t.disc], ['Total after discount =', t.taxable]);
    t.taxes.forEach((x) => rows.push([`${x.rate}% VAT =`, x.amount]));
    if (t.taxes.length || t.disc) rows.push(['Grand Total =', t.total]);
    extra.forEach((e) => rows.push(e));
    return `<table class="ptot">${rows.map(([k, v], n) => `<tr class="${n === rows.length - 1 ? 'g' : ''}"><td>${k}</td><td>${v < 0 ? '(' + BD.amt(-v) + ')' : BD.amt(v)}</td></tr>`).join('')}</table>`;
  };
  const sign = (cols) => `<p class="thanks">Thanking You</p><div class="sigs">${cols.map((l) => `<div><div class="sig-l"></div>${l}</div>`).join('')}</div>`;
  const forBD = () => `For BD SOURCE${co().signName ? `<br><b>${esc(co().signName)}</b><br>${esc(co().signTitle || '')}` : ''}`;

  A.printQuote = (id) => {
    const q = A.get('quotations', id), t = BD.qTotals(q), cl = A.get('clients', q.clientId);
    // VAT note follows the estimate's VAT setting (the Excel note "VAT or TAX are not included" only fits estimates without VAT)
    const nl = String(q.notes || '').split('\n').map((x) => x.trim()).filter((x) => x && !/vat\s*or\s*tax|vat.*(not included|excluding|including)/i.test(x));
    const vatNote = q.vatMode === 'incl' ? 'Rates are Including VAT & Tax.' : q.vatMode === 'none' ? 'VAT or TAX are not included.' : `${(BD.docTaxes(q)[0] || {}).rate || 15}% VAT is shown separately above.`;
    nl.push(`${nl.length + 1}. ${vatNote}`);
    const notes = nl.join('\n');
    const terms = [['Scope of work', q.scope], ['Delivery schedule', q.deliverySchedule], ['Artwork approval deadline', q.artworkDeadline && BD.fd(q.artworkDeadline)], ['Installation deadline', q.installDeadline && BD.fd(q.installDeadline)], ['Payment terms', q.paymentTerms], ['Exclusions', q.exclusions], ['Validity', `${q.validityDays} days (until ${BD.fd(BD.addDays(q.date, q.validityDays || 0))})`]].filter((x) => x[1]);
    A.print(lh('Estimate', toBlock({ client: cl, attn: q.contactName, ref: A.refEstimate(q), date: q.date, subject: q.subject || 'Cost Estimate for ' + q.title }) + itemTable(q.items) + totalRows(t, q) +
      `<p class="words">In Words : ${words(t.total)}</p>` + (notes ? `<div class="notes"><b>Note :</b><br>${esc(notes).replace(/\n/g, '<br>')}</div>` : '') +
      `<div class="terms">${terms.map(([k, v]) => `<p><b>${k}:</b> ${esc(v)}</p>`).join('')}</div>` + sign(['Prepared By', 'Checked By', forBD(), 'Accepted By (Client)'])), `${A.refEstimate(q).replace(/\//g, '-')} ${q.title}`);
    A.audit('Printed / exported estimate', 'Quotation', BD.qNo(q)); BD.save();
  };
  A.printInv = (id) => {
    const i = A.get('invoices', id), t = BD.invTotals(i), cl = A.get('clients', i.clientId), po = A.get('clientPOs', i.clientPoId), c = co();
    const paid = BD.invoicePaid(i);
    const extra = paid ? [['Less: Advance / Received =', -paid], ['Total Due =', BD.invoiceBalance(i)]] : [];
    const title = i.status === 'Draft' ? 'Bill (Draft)' : i.status === 'Cancelled' ? 'Bill (Cancelled)' : i.type === 'Advance' ? 'Advance Bill' : 'Bill';
    A.print(lh(title, toBlock({ client: cl, attn: (po && A.get('quotations', po.quotationId) || {}).contactName, ref: A.refBill(i), date: i.date, po: po && po.poNo, subject: i.subject || `Bill for ${clean(A.pName(i.projectId)).replace(/^PRJ-\d+-\d+ · /, '')}` }) + itemTable(i.lines) + totalRows(t, i, extra) +
      `<p class="words">In Words : ${words(paid ? BD.invoiceBalance(i) : t.total)}</p><div class="terms"><p>Payment due by ${BD.fd(i.due)}. ${esc(c.invoiceNote)}</p>${i.notes ? `<p>${esc(i.notes)}</p>` : ''}</div>` + sign(['Prepared By', 'Checked By', forBD(), 'Received By'])), A.refBill(i).replace(/\//g, '-'));
    A.audit('Printed / exported bill', 'Invoice', i.no); BD.save();
  };
  A.printSpo = (id) => {
    const s = A.get('supplierPOs', id), sp = A.get('suppliers', s.supplierId), tot = BD.spoTotal(s);
    const client = { name: sp.name, addressee: 'Proprietor / Manager', address: sp.address, contacts: sp.contactName ? [{ name: sp.contactName, phone: sp.phone }] : [] };
    A.print(lh('Purchase Order', toBlock({ client, attn: sp.contactName, ref: `BD Source/PO/${s.date.slice(0, 4)}/${seq(s.no)}`, date: s.date, subject: `Work order for ${clean(A.pName(s.projectId)).replace(/^PRJ-\d+-\d+ · /, '')} — delivery by ${BD.fd(s.deliveryDate)}` }) + itemTable(s.lines) + `<table class="ptot"><tr class="g"><td>Total Amount =</td><td>${BD.amt(tot)}</td></tr></table>` +
      `<p class="words">In Words : ${words(tot)}</p><div class="terms">${s.terms ? `<p><b>Terms:</b> ${esc(s.terms)}</p>` : ''}<p><b>Payment terms:</b> ${esc(sp.paymentTerms || 'As agreed')}</p><p>Please quote this PO number on your bill and delivery challan.</p></div>` + sign(['Prepared By', forBD(), 'Accepted By (Supplier)'])), s.no);
    A.audit('Printed supplier PO', 'Supplier PO', s.no); BD.save();
  };
  A.printChallan = (pid) => {
    const p = A.get('projects', pid), q = A.get('quotations', p.quotationId), cl = A.get('clients', p.clientId), po = A.get('clientPOs', p.clientPoId);
    const rows = q.items.map((l, n) => { const v = A.lineView(l); return `<tr><td class="c">${n + 1}</td><td><b>${esc(v.item)}</b>${v.spec ? `<br><span class="m">${esc(v.spec)}</span>` : ''}</td><td>${esc(v.size)}</td><td class="r">${v.qty} ${esc(l.kind === 'bd' && !['SFT', 'RFT'].includes(l.uom) ? l.uom : '')}</td><td></td></tr>`; }).join('');
    A.print(lh('Delivery Challan', toBlock({ client: cl, attn: q.contactName, ref: `BD Source/Challan/${T().slice(0, 4)}/${seq(p.no)}`, date: T(), po: po && po.poNo, subject: `Delivery of ${clean(p.name)}` }) +
      `<table class="items"><thead><tr><th>Sl No</th><th>Item Name</th><th>Size</th><th>Qty</th><th style="width:30%">Signature / Remarks</th></tr></thead><tbody>${rows}</tbody></table>` + sign(['Delivered By', forBD(), 'Received By (name, seal & date)'])), 'Challan ' + p.no);
    A.audit('Printed delivery challan', 'Project', p.no); BD.save();
  };
  A.printWarranty = (pid) => {
    const p = A.get('projects', pid), cl = A.get('clients', p.clientId), list = p.sites || [];
    const tot = list.reduce((a, x) => a + (+x.lights || 0), 0);
    A.print(lh('Light Warranty List', `<table class="meta"><tr><td><b>Client:</b> ${esc(clean(cl.name))}<br><b>Job:</b> ${esc(clean(p.name))} (${p.no})</td><td class="r"><b>Dated:</b> ${BD.fd(T())}</td></tr></table>` +
      `<table class="items"><thead><tr><th>Sl No</th><th>Shop Name</th><th>Area</th><th>Total Light</th><th>Fitting Light Date</th><th>Warranty Light Date</th></tr></thead><tbody>${list.map((x, n) => `<tr><td class="c">${n + 1}</td><td><b>${esc(x.shop)}</b></td><td>${esc(x.area || '')}</td><td class="r">${BD.num(x.lights || 0)} Pcs</td><td>${BD.fd(x.fitDate)}</td><td>${BD.fd(A.siteUntil(x))}</td></tr>`).join('')}</tbody></table>` +
      `<table class="ptot"><tr class="g"><td>Total Light =</td><td>${BD.num(tot)} Pcs</td></tr></table><div class="notes">${esc(co().warrantyNote || '')}</div>` + sign([forBD(), 'Received By'])), 'Warranty ' + p.no);
    A.audit('Printed light warranty list', 'Project', p.no); BD.save();
  };
  // Amount in words — Bangladeshi style used on BD SOURCE bills: "One Lac Forty Six Thousand ... Taka Only"
  function words(n) {
    n = BD.r2(Math.abs(n));
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const two = (x) => (x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : ''));
    const three = (x) => (x >= 100 ? ones[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x));
    const conv = (x) => {
      if (x === 0) return 'Zero';
      const parts = [];
      const cr = Math.floor(x / 10000000); x %= 10000000;
      const lk = Math.floor(x / 100000); x %= 100000;
      const th = Math.floor(x / 1000); x %= 1000;
      if (cr) parts.push(conv(cr) + ' Crore');
      if (lk) parts.push(two(lk) + ' Lac');
      if (th) parts.push(two(th) + ' Thousand');
      if (x) parts.push(three(x));
      return parts.join(' ');
    };
    const tk = Math.floor(n), ps = Math.round((n - tk) * 100);
    return `${conv(tk)} Taka${ps ? ' and ' + two(ps) + ' Poisha' : ''} Only`;
  }
  A.words = words;
})();


A.init();
</script>
</body>
