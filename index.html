<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai Medical Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#B92F6E;--pink-d:#9A2459;--pink-soft:#FBEAF2;--blue:#3566AC;--blue-soft:#E9F0FA;--gold:#E3A23B;--gold-soft:#FDF4E3;--ink:#1E2433;--muted:#667085;--line:#E4E7EC;--bg:#F5F6FA;--card:#fff;--red:#C2410C;--red-soft:#FDEDE5;--green:#15803D;--green-soft:#E7F5EC;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Poppins','Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.proto{background:var(--gold-soft);color:#7A4A00;font-size:12px;padding:6px 16px;text-align:center;border-bottom:1px solid #F0D8A6}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:inline-flex;flex-direction:column;line-height:1;position:relative;font-family:Poppins,sans-serif;padding-right:12px}
.logo .t{background:var(--pink);color:#fff;padding:2px 6px 3px;font-size:12px;width:max-content}
.logo .m{color:var(--blue);font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo svg{position:absolute;right:0;top:-4px;width:12px;height:12px}
.logo.big{padding-right:26px}.logo.big .t{font-size:28px;padding:4px 12px 6px}.logo.big .m{font-size:40px}.logo.big svg{width:24px;height:24px;top:-8px}
.brand-title{font-weight:600;font-size:15px;white-space:nowrap}
.brand-title small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0}
.who{font-size:12px;line-height:1.25}.who small{color:var(--muted);display:block}
.shell{display:flex;align-items:flex-start}
.side{width:220px;flex-shrink:0;padding:14px 10px;position:sticky;top:58px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.side button:hover{background:#fff;color:var(--ink)}
.side button.on{background:#fff;color:var(--pink);box-shadow:var(--sh)}
.side svg{width:18px;height:18px;flex-shrink:0}
main{flex:1;min-width:0;padding:20px 24px 60px;max-width:1240px}
h1.page{font-size:22px;margin:0 0 2px}.sub-h{color:var(--muted);margin:0 0 18px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--blue)}
.stat .n{font-size:28px;font-weight:700;line-height:1.2}.stat .l{color:var(--muted);font-size:12.5px}
.stat.pink{border-top-color:var(--pink)}.stat.gold{border-top-color:var(--gold)}.stat.red{border-top-color:var(--red)}.stat.red .n{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:16px}
.pipe{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pipe button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center}
.pipe button:hover{border-color:var(--pink)}
.pipe b{display:block;font-size:20px}.pipe span{font-size:11px;color:var(--muted);line-height:1.2;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #D0D5DD;background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:#F9FAFB}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}.btn.primary:hover{background:var(--pink-d)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}.b-gold{background:var(--gold-soft);color:#9A6200}.b-blue{background:var(--blue-soft);color:var(--blue)}.b-green{background:var(--green-soft);color:var(--green)}.b-gray{background:#F2F4F7;color:#475467}.b-pink{background:var(--pink-soft);color:var(--pink)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12px}.strike{text-decoration:line-through;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
input,select,textarea{width:100%;border:1px solid #D0D5DD;border-radius:9px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=checkbox]{width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px}
.ccard:hover{border-color:var(--pink)}
.ccard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cid{font-size:11.5px;color:var(--muted);font-weight:600}.cname{font-weight:600;font-size:15px}.cmeta{font-size:12.5px;color:var(--muted)}
.cmeta b{color:var(--ink);font-weight:500}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.step{flex:1;min-width:92px;text-align:center;font-size:11px;padding:7px 4px 0;border-top:4px solid #E4E7EC;color:var(--muted)}
.step.done{border-color:var(--blue);color:var(--blue)}.step.cur{border-color:var(--pink);color:var(--pink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--pink);border-color:var(--pink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}.kv b{font-weight:500;word-break:break-word}
.kv .full{grid-column:1/-1}
.note-item{border-left:3px solid var(--blue);padding:9px 12px;margin-bottom:10px;background:#FAFBFC;border-radius:0 8px 8px 0}
.note-item.ho{border-left-color:var(--gold)}
.note-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.note-item p{margin:3px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}.field>span{font-size:12px;color:var(--muted);font-weight:500}
.full{grid-column:1/-1}
.subhead{grid-column:1/-1;font-weight:600;font-size:13px;color:var(--blue);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.modal-back{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0;font-size:16px}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-b{padding:18px}.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:#FAFBFC;white-space:nowrap}
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h3{margin:0 8px;font-size:16px;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{min-height:96px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 5px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.blank{background:transparent;border:0;cursor:default}
.day.today{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.day.sel{background:var(--blue-soft)}
.dn{font-size:12px;font-weight:600}
.ev{font-size:10.5px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.task{background:var(--pink-soft);color:var(--pink)}.ev.appt{background:var(--blue-soft);color:var(--blue)}.ev.trav{background:var(--gold-soft);color:#8A5A00}.ev.late{background:var(--red-soft);color:var(--red)}.ev.done{background:#F2F4F7;color:#98A2B3;text-decoration:line-through}
.dots{display:none;gap:2px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%}
.dot.task{background:var(--pink)}.dot.appt{background:var(--blue)}.dot.trav{background:var(--gold)}.dot.late{background:var(--red)}.dot.done{background:#D0D5DD}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.warn{background:var(--gold-soft);border:1px solid #F0D8A6;color:#7A4A00;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.infobox{background:var(--blue-soft);border:1px solid #CBDAF0;color:#24467A;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 0 12px}
.login{min-height:calc(100vh - 32px);display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#fff 0%,var(--pink-soft) 55%,var(--blue-soft) 100%)}
.login-card{background:#fff;border-radius:18px;padding:28px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(16,24,40,.12)}
.login-card h1{margin:18px 0 0;font-size:22px}
.login-card form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.demo-ids{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.err{color:var(--red);font-size:12.5px;min-height:18px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:13px}
.chk{width:20px!important;height:20px;accent-color:var(--pink);flex-shrink:0;cursor:pointer}
.doc-ico{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0}
.doc-ico.pdf{background:var(--red-soft);color:var(--red)}.doc-ico.img{background:var(--blue-soft);color:var(--blue)}
.date-h{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.3px}
ul.clean{margin:6px 0 0;padding-left:18px}ul.clean li{margin:4px 0}
.ok-ic{color:var(--green);font-weight:700}.sim-ic{color:#9A6200;font-weight:700}.be-ic{color:var(--red);font-weight:700}
@media(max-width:960px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}.pipe{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){
 .shell{flex-direction:column;align-items:stretch}
 .side{position:sticky;top:53px;z-index:25;width:auto;flex-direction:row;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 8px}
 .side button{width:auto;white-space:nowrap;padding:7px 10px}.side button.on{box-shadow:none;background:var(--pink-soft)}
 main{padding:14px 12px 60px}.fgrid{grid-template-columns:1fr}
 .who,.brand-title small{display:none}.chip{padding:3px}
 .day{min-height:52px}.day .ev{display:none}.dots{display:flex}
 .top{padding:8px 12px;gap:8px}
 .card{padding:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ================== Thai Medical Desk — PROTOTYPE ==================
   Single-file prototype. Login, permissions, storage and file uploads are
   SIMULATED in the browser. See the "System status" page in the app.     */

const STORE='tmd_demo_v1';
let DB, meId=null, lang='bn';
try{lang=localStorage.getItem('tmd_lang')||'bn'}catch(e){}
const ui={view:'dash',caseId:null,tab:'overview',cal:{y:new Date().getFullYear(),m:new Date().getMonth()},calMode:'month',calDay:null,myOnly:false,f:{q:'',stage:'',coord:'',office:''}};
const blobs={}; // in-memory files for this browser session only

/* ---------- helpers ---------- */
const L=(bn,en)=>lang==='bn'?bn:en;
const tr=a=>a?L(a[0],a[1]):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date());
const nowISO=()=>new Date().toISOString();
const loc=()=>lang==='bn'?'bn-BD':'en-GB';
const num=n=>Number(n).toLocaleString(lang==='bn'?'bn-BD':'en-US');
const fmtDT=iso=>iso?new Date(iso).toLocaleString(loc(),{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'}):'—';
const localDT=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const initials=n=>String(n||'?').replace(/\(.*?\)|\[.*?\]/g,'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

const STAGES=[['নতুন অনুসন্ধান','New Inquiry'],['রিপোর্ট সংগ্রহ','Reports Collection'],['হাসপাতাল পর্যালোচনা','Hospital Review'],['অ্যাপয়েন্টমেন্ট নিশ্চিত','Appointment Confirmed'],['ভ্রমণ ব্যবস্থা','Travel Arrangements'],['চিকিৎসা','Treatment'],['ফলো-আপ','Follow-up'],['সম্পন্ন','Completed']];
const STAGE_COLORS=['#667085','#7C3AED','#3566AC','#0E7490','#B7791F','#B92F6E','#C2410C','#15803D'];
const OFFICES={BD:['বাংলাদেশ','Bangladesh'],TH:['থাইল্যান্ড','Thailand'],MG:['ম্যানেজমেন্ট','Management']};
const ROLES={admin:['অ্যাডমিন','Admin'],coordinator:['কোঅর্ডিনেটর','Coordinator'],viewer:['শুধু দেখা','View only']};
const STATUS={active:['সক্রিয়','Active','b-green'],invited:['আমন্ত্রিত','Invited','b-gold'],inactive:['নিষ্ক্রিয়','Deactivated','b-gray']};
const CHANNELS={phone:['ফোন','Phone'],whatsapp:['হোয়াটসঅ্যাপ','WhatsApp'],email:['ইমেইল','Email'],meeting:['সরাসরি সাক্ষাৎ','In person']};
const DOC_CATS={report:['মেডিকেল রিপোর্ট','Medical report'],prescription:['প্রেসক্রিপশন','Prescription'],quotation:['হাসপাতাল কোটেশন','Hospital quotation'],plan:['চিকিৎসা পরিকল্পনা','Treatment plan'],travel:['ভ্রমণ নথি','Travel document'],other:['অন্যান্য','Other']};
const PROPOSAL={na:['এখনও পাঠানো হয়নি','Not yet sent','b-gray'],pending:['রোগীর সিদ্ধান্তের অপেক্ষায়','Awaiting patient decision','b-gold'],accepted:['রোগী গ্রহণ করেছেন','Accepted by patient','b-green'],declined:['রোগী প্রত্যাখ্যান করেছেন','Declined by patient','b-red']};
const ARR={needed:['প্রয়োজন — বাকি','Needed — pending'],arranged:['ব্যবস্থা সম্পন্ন','Arranged'],no:['প্রয়োজন নেই','Not needed']};
const GENDER={M:['পুরুষ','Male'],F:['নারী','Female'],O:['অন্যান্য','Other']};
const opts=obj=>Object.entries(obj).map(([k,v])=>[k,tr(v)]);

/* ---------- storage (DEMO: browser only) ---------- */
function load(){try{const r=localStorage.getItem(STORE);if(r){DB=JSON.parse(r);return}}catch(e){}DB=seed();save()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB))}catch(e){toast(L('ব্রাউজারে সংরক্ষণ করা যায়নি','Could not save to browser storage'))}}
function nid(kind,prefix,w){DB.seq[kind]=(DB.seq[kind]||0)+1;return prefix+String(DB.seq[kind]).padStart(w,'0')}
function log(action,target){DB.audit.unshift({at:nowISO(),by:meId||'system',action,target:target||''});if(DB.audit.length>1500)DB.audit.length=1500}
function commit(action,target){log(action,target);save();render()}

/* ---------- permissions (SIMULATED client-side) ---------- */
const ME=()=>DB.staff.find(s=>s.id===meId);
const isAdmin=()=>ME()?.role==='admin';
const canEdit=()=>['admin','coordinator'].includes(ME()?.role);
const canAudit=()=>isAdmin()||ME()?.office==='MG';
const guard=()=>{if(canEdit())return true;toast(L('আপনার শুধু দেখার অনুমতি আছে','You have view-only access'));return false};
const sName=id=>{if(id==='system')return L('সিস্টেম','System');const s=DB.staff.find(x=>x.id===id);return s?s.name:(id||'—')};
const getCase=id=>DB.cases.find(c=>c.id===id);
const staffOpts=(fn,blank)=>{const o=DB.staff.filter(fn).map(s=>[s.id,`${s.name} — ${tr(OFFICES[s.office])}`]);return blank?[['',blank],...o]:o};
const workers=s=>s.status==='active'&&s.role!=='viewer';

/* ---------- demo seed (FICTIONAL) ---------- */
function seed(){
 const at=(n,h=10)=>{const x=new Date();x.setDate(x.getDate()+n);x.setHours(h,15,0,0);return x.toISOString()};
 const d=addDays,yr=new Date().getFullYear();

 DB=db;

let modalSave=null;
function openModal(title,body,onSave,saveLabel){
 document.getElementById('modal').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><form id="mform" onsubmit="event.preventDefault();submitModal()"><div class="modal-b">${body}</div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">${L('বাতিল','Cancel')}</button><button class="btn primary">${saveLabel||L('সংরক্ষণ','Save')}</button></div></form></div></div>`;
 modalSave=onSave;const first=document.querySelector('#mform input:not([type=hidden]),#mform select,#mform textarea');if(first&&window.innerWidth>760)first.focus();
}
function closeModal(){document.getElementById('modal').innerHTML='';modalSave=null}
function submitModal(){const f=document.getElementById('mform');const d=Object.fromEntries(new FormData(f));for(const k in d)if(typeof d[k]==='string')d[k]=d[k].trim();const fn=modalSave;if(fn&&fn(d,f)!==false)closeModal()}

/* ---------- tasks ---------- */
function taskRow(t,showCase=true){
 const c=getCase(t.caseId);const late=!t.done&&t.due<TODAY,tod=!t.done&&t.due===TODAY;
 const b=t.done?`<span class="badge b-green">${L('সম্পন্ন','Done')}</span>`:late?`<span class="badge b-red">${L('বিলম্বিত','Overdue')} · ${fmtD(t.due)}</span>`:tod?`<span class="badge b-gold">${L('আজ','Today')}</span>`:`<span class="badge b-blue">${fmtD(t.due)}</span>`;
 return `<div class="row">${canEdit()?`<input type="checkbox" class="chk" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" title="${L('সম্পন্ন চিহ্নিত করুন','Mark complete')}">`:''}<div class="grow"><div class="${t.done?'strike':''}">${esc(t.title)}</div><div class="small muted">${showCase&&c?`<a href="#" onclick="event.preventDefault();openCase('${c.id}')">${c.id} · ${esc(c.name)}</a> · `:''}${esc(sName(t.assignee))}${t.done&&t.doneBy?` · ${L('সম্পন্ন করেছেন','completed by')} ${esc(sName(t.doneBy))}`:''}</div></div>${b}</div>`;
}
function toggleTask(id){if(!guard()){render();return}const t=DB.tasks.find(x=>x.id===id);t.done=!t.done;t.doneAt=t.done?nowISO():'';t.doneBy=t.done?meId:'';commit(t.done?['কাজ সম্পন্ন','Task completed']:['কাজ পুনরায় খোলা','Task reopened'],`${t.caseId} — ${t.title}`)}
function addTask(cid){if(!guard())return;const c=cid?getCase(cid):null;
 openModal(L('ফলো-আপ কাজ যোগ করুন','Add follow-up task'),`<div class="fgrid">${cid?'':sel('caseId',L('রোগী কেস *','Patient case *'),DB.cases.filter(x=>x.stage<7).map(x=>[x.id,`${x.id} · ${x.name}`]),'','required')}${fld('title',L('কাজ *','Task *'),'','text','required')}${fld('due',L('নির্ধারিত তারিখ *','Due date *'),addDays(1),'date','required')}${sel('assignee',L('দায়িত্বপ্রাপ্ত *','Responsible *'),staffOpts(workers),c?c.coordinator:meId)}</div>`,
 d=>{const caseId=cid||d.caseId;if(!caseId||!d.title||!d.due)return false;DB.tasks.push({id:nid('task','T-',4),caseId,title:d.title,due:d.due,assignee:d.assignee,done:false,doneAt:'',doneBy:'',createdBy:meId,createdAt:nowISO()});commit(['কাজ তৈরি','Task created'],`${caseId} — ${d.title}`)})}

 <div class="card"><h3>${L('কেসের ধাপ অনুযায়ী','Cases by stage')}</h3><div class="pipe">${STAGES.map((s,i)=>`<button onclick="ui.f.stage='${i}';go('cases')"><b style="color:${STAGE_COLORS[i]}">${num(DB.cases.filter(c=>c.stage===i).length)}</b><span>${tr(s)}</span></button>`).join('')}</div></div>
 <div class="grid2"><div class="card"><h3>${L('বিলম্বিত ও আজকের কাজ','Overdue & today')}<button class="btn sm" onclick="go('calendar')">${L('ক্যালেন্ডার','Calendar')} →</button></h3>${[...overdue,...today].map(t=>taskRow(t)).join('')||empty(L('আজ কোনো বাকি কাজ নেই','Nothing due today'))}</div>
 <div class="card"><h3>${L('আসন্ন অ্যাপয়েন্টমেন্ট','Upcoming appointments')}</h3>${appts.map(c=>`<div class="row"><div class="grow"><a href="#" onclick="event.preventDefault();openCase('${c.id}')"><b>${esc(c.name)}</b></a><div class="small muted">${esc(c.hospital.name)} · ${esc(c.hospital.dept)}${c.hospital.doctor?' · '+esc(c.hospital.doctor):''}</div></div><span class="badge b-blue">${fmtD(c.hospital.apptDate)}${c.hospital.apptTime?' · '+esc(c.hospital.apptTime):''}</span></div>`).join('')||empty(L('আগামী ৩০ দিনে কোনো অ্যাপয়েন্টমেন্ট নেই','No appointments in the next 30 days'))}</div></div>
 <div class="card"><h3>${L('কেস খুঁজুন','Find cases')}</h3>${filterBar()}<div id="caseResults">${caseCards()}</div></div>`;
}

/* ---------- case list ---------- */
function filterBar(){const f=ui.f;
 return `<div class="filters"><input class="q" placeholder="${L('নাম, কেস আইডি, ফোন বা হাসপাতাল দিয়ে খুঁজুন','Search name, case ID, phone or hospital')}" value="${esc(f.q)}" oninput="setF('q',this.value)">
 <select onchange="setF('stage',this.value)"><option value="">${L('সব ধাপ','All stages')}</option>${STAGES.map((s,i)=>`<option value="${i}" ${f.stage===String(i)?'selected':''}>${tr(s)}</option>`).join('')}</select>
 <select onchange="setF('coord',this.value)"><option value="">${L('সব কোঅর্ডিনেটর','All coordinators')}</option>${DB.staff.filter(s=>s.role!=='viewer').map(s=>`<option value="${s.id}" ${f.coord===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
 <select onchange="setF('office',this.value)"><option value="">${L('সব অফিস','All offices')}</option>${Object.entries(OFFICES).map(([k,v])=>`<option value="${k}" ${f.office===k?'selected':''}>${tr(v)}</option>`).join('')}</select>
 <button class="btn" onclick="ui.f={q:'',stage:'',coord:'',office:''};render()">${L('রিসেট','Reset')}</button></div>`;
}
function setF(k,v){ui.f[k]=v;if(k==='q'){const el=document.getElementById('caseResults');if(el)el.innerHTML=caseCards()}else render()}
function filtered(){const f=ui.f,q=f.q.trim().toLowerCase(),qd=q.replace(/[\s\-+]/g,'');
 return DB.cases.filter(c=>{
  if(f.stage!==''&&c.stage!==+f.stage)return false;
  if(f.coord&&c.coordinator!==f.coord&&c.thCoordinator!==f.coord)return false;
  if(f.office){const offs=[c.coordinator,c.thCoordinator].map(id=>DB.staff.find(s=>s.id===id)?.office);if(!offs.includes(f.office))return false}
  if(q){const hay=[c.name,c.id,c.phone,c.whatsapp,c.hospital.name].join(' ').toLowerCase();if(!hay.includes(q)&&!(qd&&hay.replace(/[\s\-+]/g,'').includes(qd)))return false}
  return true}).sort((a,b)=>a.stage===7?1:b.stage===7?-1:b.createdAt.localeCompare(a.createdAt))}
function caseCards(){const list=filtered();if(!list.length)return empty(L('কোনো কেস পাওয়া যায়নি','No matching cases'));
 return `<p class="small muted" style="margin:0 0 8px">${num(list.length)} ${L('টি কেস','cases')}</p><div class="cards">${list.map(c=>`<button class="ccard" onclick="openCase('${c.id}')"><div class="ccard-top"><span class="cid">${c.id}</span>${stageBadge(c.stage)}</div><div class="cname">${esc(c.name)}</div><div class="cmeta">${L('ফোন','Phone')}: <b>${esc(c.phone)}</b></div><div class="cmeta">${L('হাসপাতাল','Hospital')}: <b>${esc(c.hospital.name||'—')}</b></div><div class="cmeta">BD: <b>${esc(sName(c.coordinator))}</b>${c.thCoordinator?` · TH: <b>${esc(sName(c.thCoordinator))}</b>`:''}</div></button>`).join('')}</div>`}
function casesHTML(){return `<div class="head-row"><div><h1 class="page">${L('রোগী কেস','Patient cases')}</h1><p class="sub-h">${L('সব কেস — খুঁজুন ও ফিল্টার করুন','All cases — search and filter')}</p></div>${canEdit()?`<button class="btn primary" onclick="newCase()">+ ${L('নতুন রোগী কেস','New patient case')}</button>`:''}</div><div class="card">${filterBar()}<div id="caseResults">${caseCards()}</div></div>`}

/* ---------- case create / edit ---------- */
function caseForm(c){c=c||{companion:{}};
 return `<div class="fgrid">${fld('name',L('রোগীর নাম *','Patient name *'),c.name,'text','required')}${fld('phone',L('ফোন *','Phone *'),c.phone,'tel','required')}${fld('whatsapp','WhatsApp',c.whatsapp,'tel')}${fld('email',L('ইমেইল','Email'),c.email,'email')}${fld('age',L('বয়স','Age'),c.age,'number','min="0" max="120"')}${sel('gender',L('লিঙ্গ','Gender'),[['','—'],...opts(GENDER)],c.gender)}${fld('city',L('শহর / জেলা','City / district'),c.city)}${sel('office',L('দায়িত্বপ্রাপ্ত অফিস','Handling office'),opts(OFFICES),c.office||'BD')}
 ${ta('needs',L('চিকিৎসা সংক্রান্ত প্রয়োজন (রোগী/পরিবারের বক্তব্য অনুযায়ী) *','Medical needs (as stated by patient/family) *'),c.needs,'required')}
 <div class="subhead">${L('সঙ্গী ব্যক্তি','Accompanying person')}</div>${fld('cName',L('নাম','Name'),c.companion.name)}${fld('cRel',L('সম্পর্ক','Relationship'),c.companion.relation)}${fld('cPhone',L('ফোন','Phone'),c.companion.phone,'tel')}
 <div class="subhead">${L('দায়িত্ব','Responsibility')}</div>${sel('coordinator',L('দায়িত্বপ্রাপ্ত কোঅর্ডিনেটর *','Responsible coordinator *'),staffOpts(workers),c.coordinator||meId)}</div>
 <p class="small muted" style="margin:12px 0 0">${L('এই সিস্টেম কোনো রোগনির্ণয় বা চিকিৎসা পরামর্শ দেয় না।','This system does not provide diagnoses or treatment recommendations.')}</p>`}
function newCase(){if(!guard())return;openModal(L('নতুন রোগী কেস','New patient case'),caseForm(),d=>{if(!d.name||!d.phone||!d.needs)return false;
 const c={id:nid('case',`TMD-${new Date().getFullYear()}-`,4),name:d.name,phone:d.phone,whatsapp:d.whatsapp,email:d.email,age:d.age,gender:d.gender,city:d.city,office:d.office,needs:d.needs,companion:{name:d.cName,relation:d.cRel,phone:d.cPhone},coordinator:d.coordinator,thCoordinator:'',stage:0,createdAt:nowISO(),createdBy:meId,hospital:{name:'',dept:'',doctor:'',apptDate:'',apptTime:'',reportsSubmitted:'',responseReceived:'',proposal:'na',notes:''},travel:{arrDate:'',arrFlight:'',depDate:'',depFlight:'',hotel:'',airport:'',hospTransport:'',interpreter:'',notes:'',updatedBy:'',updatedAt:''},handover:[],docs:[],comms:[]};
 DB.cases.push(c);ui.view='case';ui.caseId=c.id;ui.tab='overview';commit(['রোগী কেস তৈরি','Case created'],`${c.id} — ${c.name}`);toast(L('কেস তৈরি হয়েছে: ','Case created: ')+c.id)},L('কেস তৈরি করুন','Create case'))}
function editCase(id){if(!guard())return;const c=getCase(id);openModal(L('রোগীর তথ্য সম্পাদনা','Edit patient details'),caseForm(c),d=>{if(!d.name||!d.phone||!d.needs)return false;
 const prevCo=c.coordinator;Object.assign(c,{name:d.name,phone:d.phone,whatsapp:d.whatsapp,email:d.email,age:d.age,gender:d.gender,city:d.city,office:d.office,needs:d.needs,coordinator:d.coordinator});c.companion={name:d.cName,relation:d.cRel,phone:d.cPhone};
 commit(prevCo!==d.coordinator?['কোঅর্ডিনেটর পরিবর্তন ও তথ্য হালনাগাদ','Details updated; coordinator reassigned']:['রোগীর তথ্য হালনাগাদ','Patient details updated'],c.id)})}
function moveStage(dir){if(!guard())return;const c=getCase(ui.caseId);const n=c.stage+dir;if(n<0||n>7)return;const from=c.stage;c.stage=n;commit(['ধাপ পরিবর্তন','Stage changed'],`${c.id}: ${STAGES[from][1]} → ${STAGES[n][1]}`)}

/* ---------- case detail ---------- */
function caseHTML(){const c=getCase(ui.caseId);if(!c)return denied();
 const tabs=[['overview',L('সংক্ষিপ্ত বিবরণ','Overview')],['docs',L('মেডিকেল নথি','Medical records')+` (${num(c.docs.length)})`],['comms',L('যোগাযোগ ইতিহাস','Communication')+` (${num(c.comms.length)})`],['hospital',L('হাসপাতাল ও অ্যাপয়েন্টমেন্ট','Hospital & appointment')],['thai',L('থাইল্যান্ড সহায়তা','Thailand assistance')],['tasks',L('ফলো-আপ কাজ','Follow-up tasks')+` (${num(DB.tasks.filter(t=>t.caseId===c.id&&!t.done).length)})`]];
 const body={overview:tabOverview,docs:tabDocs,comms:tabComms,hospital:tabHospital,thai:tabThai,tasks:tabTasks}[ui.tab](c);
 return `<button class="btn sm" onclick="go('cases')" style="margin-bottom:12px">← ${L('সব কেস','All cases')}</button>
 <div class="card"><div class="head-row"><div><div class="cid">${c.id} · ${tr(OFFICES[c.office])}</div><h1 class="page">${esc(c.name)}</h1><div class="small muted">${L('তৈরি','Created')} ${fmtDT(c.createdAt)} · ${esc(sName(c.createdBy))}</div></div><div>${stageBadge(c.stage)}</div></div>
 <div class="stepper">${STAGES.map((s,i)=>`<div class="step ${i<c.stage?'done':i===c.stage?'cur':''}">${tr(s)}</div>`).join('')}</div>
 ${canEdit()?`<div class="btns"><button class="btn sm" ${c.stage===0?'disabled':''} onclick="moveStage(-1)">← ${L('আগের ধাপ','Previous stage')}</button><button class="btn sm primary" ${c.stage===7?'disabled':''} onclick="moveStage(1)">${c.stage<7?L('পরের ধাপ: ','Next: ')+tr(STAGES[Math.min(7,c.stage+1)]):L('সম্পন্ন','Completed')} →</button></div>`:''}</div>
 <div class="tabs">${tabs.map(([k,t])=>`<button class="${ui.tab===k?'on':''}" onclick="setTab('${k}')">${t}</button>`).join('')}</div>${body}`}

function tabOverview(c){const cp=c.companion||{};
 return `<div class="card"><h3>${L('রোগীর তথ্য','Patient details')}${canEdit()?`<button class="btn sm" onclick="editCase('${c.id}')">${L('সম্পাদনা','Edit')}</button>`:''}</h3><div class="kv">${kv(L('ফোন','Phone'),esc(c.phone))}${kv('WhatsApp',esc(c.whatsapp))}${kv(L('ইমেইল','Email'),esc(c.email))}${kv(L('বয়স','Age'),esc(c.age))}${kv(L('লিঙ্গ','Gender'),c.gender?tr(GENDER[c.gender]):'')}${kv(L('শহর / জেলা','City / district'),esc(c.city))}${kv(L('চিকিৎসা সংক্রান্ত প্রয়োজন (রোগীর বক্তব্য)','Medical needs (as stated)'),esc(c.needs),true)}</div></div>
 <div class="grid2"><div class="card"><h3>${L('সঙ্গী ব্যক্তি','Accompanying person')}</h3><div class="kv">${kv(L('নাম','Name'),esc(cp.name))}${kv(L('সম্পর্ক','Relationship'),esc(cp.relation))}${kv(L('ফোন','Phone'),esc(cp.phone))}</div></div>
 <div class="card"><h3>${L('দায়িত্বপ্রাপ্ত টিম','Assigned team')}</h3><div class="kv">${kv(L('বাংলাদেশ কোঅর্ডিনেটর','Responsible coordinator'),esc(sName(c.coordinator)))}${kv(L('থাইল্যান্ড কোঅর্ডিনেটর','Thailand coordinator'),c.thCoordinator?esc(sName(c.thCoordinator)):`<span class="muted">${L('নির্ধারিত হয়নি','Not assigned')}</span>`)}${kv(L('হাসপাতাল','Hospital'),esc(c.hospital.name))}${kv(L('অ্যাপয়েন্টমেন্ট','Appointment'),c.hospital.apptDate?fmtD(c.hospital.apptDate)+(c.hospital.apptTime?' · '+esc(c.hospital.apptTime):''):'')}</div></div></div>`}

function tabDocs(c){const groups={};c.docs.forEach(d=>(groups[d.date||'']=groups[d.date||'']||[]).push(d));const keys=Object.keys(groups).sort().reverse();
 return `<div class="card"><h3>${L('মেডিকেল নথি (তারিখ অনুযায়ী)','Medical records (by date)')}${canEdit()?`<button class="btn sm primary" onclick="uploadDoc('${c.id}')">+ ${L('আপলোড','Upload')}</button>`:''}</h3>
 <div class="infobox">${L('প্রোটোটাইপ: আপলোড করা ফাইল শুধু এই ব্রাউজার সেশনের মেমরিতে থাকে; শুধু তথ্য (মেটাডেটা) সংরক্ষিত হয়। প্রোডাকশনে সুরক্ষিত প্রাইভেট স্টোরেজ ও সাইনড লিংক প্রয়োজন।','Prototype: uploaded files are held in this browser session\u2019s memory only; only the metadata is saved. Production needs protected private storage with signed links.')}</div>
 ${keys.length?keys.map(k=>`<div class="date-h">${k?fmtD(k):L('তারিখ নেই','No date')}</div>${groups[k].map(d=>docRow(c,d)).join('')}`).join(''):empty(L('এখনও কোনো নথি নেই','No documents yet'))}</div>`}
function docRow(c,d){const pdf=/\.pdf$/i.test(d.name);
 return `<div class="row"><div class="doc-ico ${pdf?'pdf':'img'}">${pdf?'PDF':'IMG'}</div><div class="grow"><div style="word-break:break-all">${esc(d.name)}${d.demo?' <span class="badge b-gray">DEMO</span>':''}</div><div class="small muted">${tr(DOC_CATS[d.cat])} · ${fmtSize(d.size||0)} · ${L('আপলোড','uploaded by')} ${esc(sName(d.by))}, ${fmtDT(d.at)}</div></div><div class="btns"><button class="btn sm" onclick="docAction('${c.id}','${d.id}','view')">${L('দেখুন','View')}</button><button class="btn sm" onclick="docAction('${c.id}','${d.id}','download')">${L('ডাউনলোড','Download')}</button></div></div>`}
function uploadDoc(cid,cat){if(!guard())return;
 openModal(L('নথি আপলোড','Upload document'),`<div class="fgrid"><label class="field full"><span>${L('ফাইল — PDF, JPG বা PNG (সর্বোচ্চ ১০ MB) *','File — PDF, JPG or PNG (max 10 MB) *')}</span><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple required></label>${sel('cat',L('ধরন','Category'),opts(DOC_CATS),cat||'report')}${fld('date',L('নথির তারিখ','Document date'),TODAY,'date','required')}</div>`,
 (d,f)=>{const files=[...f.querySelector('input[type=file]').files];if(!files.length)return false;const bad=files.filter(x=>!/\.(pdf|jpe?g|png)$/i.test(x.name)||x.size>10485760);if(bad.length){toast(L('শুধু ১০ MB পর্যন্ত PDF/JPG/PNG অনুমোদিত: ','Only PDF/JPG/PNG up to 10 MB allowed: ')+bad.map(x=>x.name).join(', '));return false}
 const c=getCase(cid);files.forEach(file=>{const id=nid('doc','DOC-',4);blobs[id]=URL.createObjectURL(file);c.docs.push({id,name:file.name,cat:d.cat,date:d.date||TODAY,by:meId,at:nowISO(),size:file.size})});
 commit(['নথি আপলোড','Document uploaded'],`${cid} — ${files.map(x=>x.name).join(', ')}`)},L('আপলোড','Upload'))}
function docAction(cid,did,mode){const c=getCase(cid),d=c.docs.find(x=>x.id===did);const url=blobs[did];
 log(mode==='view'?['নথি দেখা হয়েছে','Document viewed']:['নথি ডাউনলোড','Document downloaded'],`${cid} — ${d.name}`);save();
 if(!url){toast(d.demo?L('ডেমো নথি — কোনো আসল ফাইল সংযুক্ত নেই (সিমুলেটেড)।','Demo record — no real file attached (simulated).'):L('ফাইলটি শুধু আপলোডের সেশনে ব্রাউজার মেমরিতে ছিল। প্রোডাকশনে সুরক্ষিত স্টোরেজ প্রয়োজন।','The file was only held in browser memory during the upload session. Production needs protected storage.'));return}
 if(mode==='view')window.open(url,'_blank');else{const a=document.createElement('a');a.href=url;a.download=d.name;document.body.appendChild(a);a.click();a.remove()}}

function tabComms(c){const list=[...c.comms].sort((a,b)=>b.at.localeCompare(a.at));
 return `<div class="card"><h3>${L('যোগাযোগ ইতিহাস','Communication history')}${canEdit()?`<button class="btn sm primary" onclick="addNote('${c.id}')">+ ${L('নোট যোগ করুন','Add note')}</button>`:''}</h3>
 <div class="infobox">${L('এগুলো স্টাফের হাতে লেখা নোট। কোনো WhatsApp/ইমেইল ইন্টিগ্রেশন সংযুক্ত নেই। নোট সম্পাদনা বা মুছে ফেলা যায় না — পুরনো নোট সংরক্ষিত থাকে।','These are manual staff notes. No WhatsApp/email integration is connected. Notes cannot be edited or deleted — history is preserved.')}</div>

function calItems(date){const my=ui.myOnly,items=[];
 DB.tasks.forEach(t=>{if(t.due===date&&(!my||t.assignee===meId)){const c=getCase(t.caseId);items.push({k:t.done?'done':(t.due<TODAY?'late':'task'),label:t.title,task:t})}});
 DB.cases.forEach(c=>{if(my&&c.coordinator!==meId&&c.thCoordinator!==meId)return;
  if(c.hospital.apptDate===date)items.push({k:'appt',label:L('অ্যাপয়েন্টমেন্ট: ','Appointment: ')+c.name,sub:[c.hospital.apptTime,c.hospital.name,c.hospital.doctor].filter(Boolean).join(' · '),cid:c.id});
  if(c.travel.arrDate===date)items.push({k:'trav',label:L('আগমন: ','Arrival: ')+c.name,sub:c.travel.arrFlight,cid:c.id});
  if(c.travel.depDate===date)items.push({k:'trav',label:L('প্রস্থান: ','Departure: ')+c.name,sub:c.travel.depFlight,cid:c.id})});
 return items}
const itemRow=it=>it.task?taskRow(it.task):`<div class="row"><div class="grow"><a href="#" onclick="event.preventDefault();openCase('${it.cid}')">${esc(it.label)}</a><div class="small muted">${esc(it.sub||'')}</div></div><span class="badge ${it.k==='appt'?'b-blue':'b-gold'}">${it.k==='appt'?L('অ্যাপয়েন্টমেন্ট','Appointment'):L('ভ্রমণ','Travel')}</span></div>`;

function calendarHTML(){
 const head=`<div class="head-row"><div><h1 class="page">${L('ফলো-আপ ক্যালেন্ডার','Follow-up calendar')}</h1><p class="sub-h">${L('কাজ, অ্যাপয়েন্টমেন্ট ও ভ্রমণের তারিখ','Tasks, appointments and travel dates')}</p></div>${canEdit()?`<button class="btn primary" onclick="addTask()">+ ${L('কাজ যোগ করুন','Add task')}</button>`:''}</div>
 <div class="cal-head"><div class="btns"><button class="btn sm ${ui.calMode==='month'?'blue':''}" onclick="ui.calMode='month';render()">${L('মাসিক','Month')}</button><button class="btn sm ${ui.calMode==='list'?'blue':''}" onclick="ui.calMode='list';render()">${L('কাজের তালিকা','Task list')}</button></div>
 <label class="small" style="display:flex;align-items:center;gap:6px;margin-left:auto"><input type="checkbox" ${ui.myOnly?'checked':''} onchange="ui.myOnly=this.checked;render()"> ${L('শুধু আমার','Mine only')}</label></div>`;
 if(ui.calMode==='list')return head+calList();
 const{y,m}=ui.cal;const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 const dows=lang==='bn'?['সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি','রবি']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 let cells='';for(let i=0;i<start;i++)cells+='<div class="day blank"></div>';
 for(let dd=1;dd<=days;dd++){const date=`${y}-${pad(m+1)}-${pad(dd)}`;const its=calItems(date);
  cells+=`<button class="day ${date===TODAY?'today':''} ${ui.calDay===date?'sel':''}" onclick="ui.calDay='${date}';render()"><span class="dn">${num(dd)}</span>${its.slice(0,3).map(i=>`<span class="ev ${i.k}">${esc(i.label)}</span>`).join('')}${its.length>3?`<span class="small muted">+${num(its.length-3)}</span>`:''}<span class="dots">${its.map(i=>`<i class="dot ${i.k}"></i>`).join('')}</span></button>`}
 const selD=ui.calDay;
 return head+`<div class="card"><div class="cal-head" style="justify-content:center"><button class="btn sm" onclick="calNav(-1)">‹</button><h3>${first.toLocaleDateString(loc(),{month:'long',year:'numeric'})}</h3><button class="btn sm" onclick="calNav(1)">›</button><button class="btn sm" onclick="ui.cal={y:new Date().getFullYear(),m:new Date().getMonth()};ui.calDay='${TODAY}';render()">${L('আজ','Today')}</button></div>
 <div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
 <div class="legend"><span><i style="background:var(--pink)"></i>${L('কাজ','Task')}</span><span><i style="background:var(--red)"></i>${L('বিলম্বিত','Overdue')}</span><span><i style="background:var(--blue)"></i>${L('অ্যাপয়েন্টমেন্ট','Appointment')}</span><span><i style="background:var(--gold)"></i>${L('আগমন/প্রস্থান','Arrival/departure')}</span></div></div>
 ${selD?`<div class="card"><h3>${fmtD(selD)}</h3>${calItems(selD).map(itemRow).join('')||empty(L('এই দিনে কিছু নেই','Nothing on this day'))}</div>`:''}`}
function calList(){const my=ui.myOnly;const open=DB.tasks.filter(t=>!t.done&&(!my||t.assignee===meId));
 const overdue=open.filter(t=>t.due<TODAY).sort((a,b)=>a.due.localeCompare(b.due));
 let upcoming='';for(let i=1;i<=14;i++){const d=addDays(i);const its=calItems(d).filter(x=>x.k!=='done');if(its.length)upcoming+=`<div class="date-h">${fmtD(d)}</div>${its.map(itemRow).join('')}`}

 return `<div class="grid2"><div class="card"><h3>${L('বিলম্বিত','Overdue')} <span class="badge b-red">${num(overdue.length)}</span></h3>${overdue.map(t=>taskRow(t)).join('')||empty(L('কোনো বিলম্বিত কাজ নেই','No overdue tasks'))}</div>
 <div class="card"><h3>${L('আজ','Today')}</h3>${calItems(TODAY).filter(x=>x.k!=='done').map(itemRow).join('')||empty(L('আজ কিছু নেই','Nothing today'))}</div></div>
 <div class="card"><h3>${L('আগামী ১৪ দিন','Next 14 days')}</h3>${upcoming||empty(L('কিছু নির্ধারিত নেই','Nothing scheduled'))}</div>
 <div class="card"><h3>${L('সম্প্রতি সম্পন্ন','Recently completed')}</h3>${done.map(t=>taskRow(t)).join('')||empty('—')}</div>`}

 <div class="card"><h3>${L('অনুমতির নিয়ম','Permission rules')}</h3><ul class="clean"><li><b>${tr(ROLES.admin)}</b> — ${L('স্টাফ আমন্ত্রণ, সম্পাদনা, নিষ্ক্রিয় করা; সব কেস পরিচালনা; অডিট ইতিহাস','invite, edit and deactivate staff; manage all cases; audit history')}</li><li><b>${tr(ROLES.coordinator)}</b> — ${L('রোগী কেস তৈরি ও পরিচালনা, নথি আপলোড, নোট ও কাজ','create and manage patient cases, upload records, notes and tasks')}</li><li><b>${tr(ROLES.viewer)}</b> — ${L('কেস দেখা ও নথি ডাউনলোড, কোনো পরিবর্তন নয়','view cases and download records, no changes')}</li><li>${L('ম্যানেজমেন্ট অফিসের সবাই অডিট ইতিহাস দেখতে পারেন','Everyone in the Management office can view the audit history')}</li></ul></div>`}
function staffForm(s){s=s||{};return `<div class="fgrid">${fld('name',L('নাম *','Name *'),s.name,'text','required')}${fld('email',L('ইমেইল *','Email *'),s.email,'email','required')}${sel('office',L('অফিস','Office'),opts(OFFICES),s.office||'BD')}${sel('role',L('ভূমিকা','Role'),opts(ROLES),s.role||'coordinator',s.id===meId?'disabled':'')}</div>`}
function inviteStaff(){if(!isAdmin())return;openModal(L('স্টাফ আমন্ত্রণ','Invite staff'),staffForm()+`<div class="warn">${L('প্রোডাকশনে এই ঠিকানায় একটি নিরাপদ আমন্ত্রণ ইমেইল যাবে। এই প্রোটোটাইপে কোনো ইমেইল পাঠানো হয় না — অনুমোদন দিতে তালিকায় "অনুমোদন" চাপুন।','In production a secure invitation email is sent. This prototype sends no email — press "Approve" in the list to activate.')}</div>`,
 d=>{if(!d.name||!d.email)return false;if(DB.staff.some(s=>s.email.toLowerCase()===d.email.toLowerCase())){toast(L('এই ইমেইল আগে থেকেই আছে','This email already exists'));return false}const id=nid('staff','STF-',3);DB.staff.push({id,name:d.name,email:d.email,office:d.office,role:d.role,status:'invited',createdAt:nowISO()});commit(['স্টাফ আমন্ত্রণ','Staff invited'],`${id} — ${d.email}`);toast(L('আমন্ত্রিত: ','Invited: ')+id)},L('আমন্ত্রণ পাঠান','Send invite'))}
function editStaff(id){if(!isAdmin())return;const s=DB.staff.find(x=>x.id===id);openModal(L('স্টাফ সম্পাদনা','Edit staff')+' — '+id,staffForm(s),d=>{if(!d.name||!d.email)return false;Object.assign(s,{name:d.name,email:d.email,office:d.office});if(id!==meId&&d.role)s.role=d.role;commit(['স্টাফ তথ্য হালনাগাদ','Staff updated'],id)})}
function setStaffStatus(id,st){if(!isAdmin()||id===meId)return;const s=DB.staff.find(x=>x.id===id);const n=DB.cases.filter(c=>c.stage<7&&(c.coordinator===id||c.thCoordinator===id)).length;
 if(st==='inactive'&&!confirm(L(`${s.name} কে নিষ্ক্রিয় করবেন? তিনি আর লগইন করতে পারবেন না।`,`Deactivate ${s.name}? They will no longer be able to sign in.`)))return;
 s.status=st;commit(st==='active'?['স্টাফ সক্রিয়/অনুমোদিত','Staff activated/approved']:['স্টাফ নিষ্ক্রিয়','Staff deactivated'],id);
 if(st==='inactive'&&n)toast(L(`সতর্কতা: ${num(n)}টি সক্রিয় কেস নতুন কোঅর্ডিনেটরকে দিতে হবে।`,`Note: ${n} active case(s) need a new coordinator.`))}

/* ---------- audit ---------- */
function auditHTML(){return `<h1 class="page">${L('অডিট ইতিহাস','Audit history')}</h1><p class="sub-h">${L('কে কখন কী করেছেন — সর্বশেষ ৩০০টি','Who did what and when — latest 300 entries')}</p>
 <div class="warn">${L('প্রোটোটাইপ: এই লগ ব্রাউজারে থাকে, তাই এটি বিশ্বাসযোগ্য অডিট নয়। প্রোডাকশনে সার্ভার-সাইডে পরিবর্তন-অযোগ্য লগ প্রয়োজন।','Prototype: this log lives in the browser, so it is not a trustworthy audit trail. Production needs a server-side, append-only log.')}</div>
 <div class="card"><div class="tbl-wrap"><table><thead><tr><th>${L('সময়','Time')}</th><th>${L('স্টাফ','Staff')}</th><th>${L('কাজ','Action')}</th><th>${L('বিষয়','Target')}</th></tr></thead><tbody>${DB.audit.slice(0,300).map(a=>`<tr><td style="white-space:nowrap">${fmtDT(a.at)}</td><td style="white-space:nowrap">${esc(sName(a.by))}</td><td>${esc(tr(a.action))}</td><td>${esc(a.target)}</td></tr>`).join('')}</tbody></table></div></div>`}

/* ---------- system status & setup ---------- */
function infoHTML(){
 const ok=[['স্টাফ আইডি, অফিস (বাংলাদেশ/থাইল্যান্ড/ম্যানেজমেন্ট), ভূমিকা; আমন্ত্রণ, অনুমোদন, নিষ্ক্রিয় করা','Staff IDs, office (BD/TH/Management), roles; invite, approve, deactivate'],['স্বয়ংক্রিয় কেস আইডি (TMD-বছর-নম্বর), রোগী ও সঙ্গীর তথ্য, কোঅর্ডিনেটর নির্ধারণ','Auto case IDs (TMD-year-number), patient & companion details, coordinator assignment'],['৮ ধাপের কেস ট্র্যাকিং','8-stage case tracking'],['নথির তালিকা তারিখ ও রোগী অনুযায়ী, কে আপলোড করেছেন তা রেকর্ড','Records organised by patient and date, uploader recorded'],['পরিবর্তন-অযোগ্য যোগাযোগ নোট (ফলাফল ও পরবর্তী পদক্ষেপসহ)','Append-only communication notes with outcome and next action'],['ফলো-আপ কাজ, আজকের/আসন্ন/বিলম্বিত, মাসিক ক্যালেন্ডার ও তালিকা','Follow-up tasks, today/upcoming/overdue, monthly calendar and list'],['হাসপাতাল, বিভাগ, ডাক্তার, অ্যাপয়েন্টমেন্ট, রিপোর্ট পাঠানো/উত্তর পাওয়া, প্রস্তাব গ্রহণ','Hospital, department, doctor, appointment, reports sent/response received, proposal acceptance'],['থাইল্যান্ড ব্যবস্থা ও দুই অফিসের হ্যান্ডওভার নোট','Thailand arrangements and shared handover notes'],['ড্যাশবোর্ড, সার্চ (নাম/আইডি/ফোন/হাসপাতাল), ধাপ/কোঅর্ডিনেটর/অফিস ফিল্টার','Dashboard, search (name/ID/phone/hospital), stage/coordinator/office filters'],['বাংলা/ইংরেজি ইন্টারফেস, মোবাইল ও ডেস্কটপ','Bengali/English interface, mobile and desktop']];
 const sim=[['লগইন — পাসওয়ার্ড বা সার্ভার যাচাই নেই','Login — no password or server verification'],['অনুমতি — শুধু ব্রাউজারে প্রয়োগ হয়, সহজেই এড়ানো যায়','Permissions — enforced only in the browser, easily bypassed'],['সংরক্ষণ — এই ব্রাউজারের লোকাল স্টোরেজে, অন্য স্টাফের সাথে শেয়ার হয় না','Saving — this browser\u2019s local storage only, not shared between staff'],['ফাইল আপলোড — শুধু সেশন মেমরিতে; রিফ্রেশে ফাইল হারায়','File uploads — session memory only; files are lost on refresh'],['অডিট লগ — ব্রাউজারে থাকে, পরিবর্তনযোগ্য','Audit log — stored in the browser, can be altered'],['স্টাফ আমন্ত্রণ — কোনো ইমেইল পাঠানো হয় না','Staff invitations — no email is sent']];
 const be=[['সার্ভার-সাইড অথেনটিকেশন (ইমেইল আমন্ত্রণ, পাসওয়ার্ড/ম্যাজিক লিংক, MFA)','Server-side authentication (email invites, password/magic link, MFA)'],['শেয়ার্ড ডাটাবেস ও রো-লেভেল সিকিউরিটি (ভূমিকা ও অফিস অনুযায়ী)','Shared database with row-level security by role and office'],['প্রাইভেট ফাইল স্টোরেজ, স্বল্পমেয়াদি সাইনড লিংক','Private file storage with short-lived signed links'],['সার্ভারে লেখা, পরিবর্তন-অযোগ্য অডিট লগ','Server-written, append-only audit log'],['WhatsApp Business / ইমেইল ইন্টিগ্রেশন (ঐচ্ছিক)','WhatsApp Business / email integration (optional)'],['ব্যাকআপ, এনক্রিপশন, ও থাইল্যান্ড PDPA ও বাংলাদেশের প্রযোজ্য ডেটা-সুরক্ষা আইন মেনে চলা','Backups, encryption, and compliance with Thailand\u2019s PDPA and applicable Bangladesh data-protection rules']];
 const li=(a,c,i)=>a.map(x=>`<li><span class="${c}">${i}</span> ${tr(x)}</li>`).join('');
 return `<h1 class="page">${L('সিস্টেম স্ট্যাটাস ও সেটআপ','System status & setup')}</h1><p class="sub-h">${L('এটি একটি কার্যকর প্রোটোটাইপ — প্রোডাকশন-প্রস্তুত নয়।','This is a working prototype — it is not production-ready.')}</p>

 <div class="card"><h3>${L('ব্যাকএন্ড প্রয়োজন','Requires a backend')}</h3><ul class="clean" style="list-style:none;padding:0">${li(be,'be-ic','→')}</ul></div>
 <div class="card"><h3>${L('সেটআপ নির্দেশনা','Setup instructions')}</h3><ol class="clean">
 <li>${L('ফাইলটি Chrome, Edge বা Safari-তে খুলুন — কোনো ইনস্টল প্রয়োজন নেই।','Open the file in Chrome, Edge or Safari — nothing to install.')}</li>
 <li>${L('অ্যাডমিন হিসেবে STF-001, কোঅর্ডিনেটর হিসেবে STF-002–005, শুধু দেখার জন্য STF-006 দিয়ে প্রবেশ করুন।','Sign in as STF-001 (admin), STF-002–005 (coordinators) or STF-006 (view only).')}</li>
 <li>${L('ডেমো ডেটা এই ডিভাইসেই থাকে। নিচের বোতাম দিয়ে শুরুর অবস্থায় ফেরানো যায়।','Demo data stays on this device. Use the button below to restore the starting state.')}</li>
 <li>${L('প্রোডাকশনের জন্য: একটি ব্যাকএন্ড (যেমন Supabase — Auth, Postgres RLS, প্রাইভেট Storage bucket) সেটআপ করে localStorage ফাংশনগুলো (load/save) API কলে বদলাতে হবে, এবং অনুমতি সার্ভারে প্রয়োগ করতে হবে।','For production: set up a backend (e.g. Supabase — Auth, Postgres with RLS, a private Storage bucket), replace the load/save functions with API calls, and enforce permissions on the server.')}</li></ol>

function resetDemo(){if(!confirm(L('সব ডেমো ডেটা মুছে শুরুর অবস্থায় ফেরানো হবে। চালিয়ে যাবেন?','All demo data will be cleared and restored to the starting state. Continue?')))return;try{localStorage.removeItem(STORE);sessionStorage.removeItem('tmd_me')}catch(e){}DB=seed();save();meId=null;Object.assign(ui,{view:'dash',caseId:null,f:{q:'',stage:'',coord:'',office:''}});render()}

/* ---------- init ---------- */
load();
try{meId=sessionStorage.getItem('tmd_me')}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
